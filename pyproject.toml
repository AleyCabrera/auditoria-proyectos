[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor"
version = "0.1.0"
description = "Empaqueta tu proyecto en Markdown + hallazgos para que una IA lo audite."
requires-python = ">=3.11"
dependencies = ["pathspec>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
auditor = "auditor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auditor*"]